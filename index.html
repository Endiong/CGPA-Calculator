<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>CGPA Calculator — Track & Calculate Your Academic Performance</title>
  <meta name="description" content="Free CGPA Calculator for Nigerian university students. Calculate your cumulative GPA, track semesters, scan results with AI, and export professional PDF reports." />
  <meta name="keywords" content="CGPA calculator, GPA calculator, Nigerian university, academic performance, semester GPA, cumulative GPA, result checker, transcript, 5.0 scale, 4.0 scale" />
  <meta name="author" content="Endiong" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CGPA Calculator — Track Your Academic Performance" />
  <meta property="og:description" content="Free CGPA calculator for university students. AI-powered result scanning, semester tracking, and professional PDF export." />
  <meta property="og:site_name" content="CGPA Calculator" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CGPA Calculator — Track Your Academic Performance" />
  <meta name="twitter:description" content="Free CGPA calculator for university students. AI-powered result scanning, semester tracking, and professional PDF export." />

  <!-- Mobile App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CGPA Calculator" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: "#6b7280",
            "primary-dark": "#4b5563",
            "primary-light": "#f3f4f6",
          },
          backgroundColor: {
            'dark-base': '#0a0a0f',
            'dark-surface': '#111118',
            'dark-card': '#1a1a24',
          }
        },
      },
    }
  </script>
  <style>
    * {
      font-family: 'Inter', system-ui, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #4b5563;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>
  <!-- Theme: apply immediately to prevent flash of wrong theme -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        if (!t) localStorage.setItem('theme', 'light');
      }
    })();
  </script>
</head>

<body class="bg-gray-50 dark:bg-[#0d0d14] text-gray-900 dark:text-gray-100 overflow-hidden transition-colors">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
